name: Feature request
description: Propose a user problem or improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who has this problem, and when does it occur?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, permission, or data impact
      description: Note any new data source, network destination, permission, or retention change.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
